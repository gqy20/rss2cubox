name: RSS to IC - Quick Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run quick test
        env:
          IC_SOURCE_TYPE: "gqy"
          KEYWORDS_INCLUDE: ""
          KEYWORDS_EXCLUDE: ""
          MAX_ITEMS_PER_RUN: "3"
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          AI_MAX_CANDIDATES: "20"
          # enrich 配置
          ENRICH_MAX_BUDGET_USD: "1.5"
          # global 配置
          GLOBAL_AGENT_ENABLED: "true"
          # RSS 配置
          RSSHUB_PRIVATE_INSTANCES: ${{ secrets.RSSHUB_PRIVATE_INSTANCES }}
          RSSHUB_BILIBILI_INSTANCES: ${{ secrets.RSSHUB_BILIBILI_INSTANCES || 'https://rss.spriple.org' }}
          RSSHUB_TWITTER_INSTANCES: ${{ secrets.RSSHUB_TWITTER_INSTANCES }}
          RSSHUB_BILIBILI_RETRY_ATTEMPTS: "3"
          RSSHUB_TWITTER_RETRY_ATTEMPTS: "2"
          RSSHUB_INSTANCES_FILE: "rsshub_instances.txt"
          RSSHUB_FAILURE_COOLDOWN_SECONDS: "60"
          # 不写入数据库，仅测试分析流程
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          export IC_API_URL="http://127.0.0.1:9/api/v1/articles/batch"
          rss2cubox 2>&1 | tee rss2cubox-test.log

      - name: Upload test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss2cubox-test-log-${{ github.run_id }}
          path: rss2cubox-test.log
          if-no-files-found: warn

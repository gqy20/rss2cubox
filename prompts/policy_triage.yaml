# 政策预筛 Agent —— 标题打包判定 is_policy + ai_relevance，成本约为逐篇的 1/50。
# 迁移自 src/rss2cubox/policy/triage_agent.py 的 SYSTEM_PROMPT / TRIAGE_OUTPUT_SCHEMA。

version: 1
description: 政策源标题批量预筛，只做「是否政策文件 + AI 相关度」两个判断

system_prompt: |-
  你是中国政策情报的预筛员。任务是对一批政策类网站的条目**标题**做快速分类，决定哪些值得进入后续的深度结构化抽取。你只看标题，不追求精确，追求便宜且不漏。

  【is_policy 判定】
  true：法律/行政法规/部门规章/地方性法规/地方政府规章/规范性文件/指导意见/征求意见稿/技术标准/规划/实施方案/管理办法，以及它们的解读、废止、修订、批复。
  false：民生服务通知（停水停电、公交月票、招考报名、场馆开放、活动打卡）、人事任免、会议报道、领导活动、统计数据发布、工作报告、节日慰问、招商引资签约。

  【ai_relevance 评分标准】与深度抽取阶段保持完全一致：
  {shared.ai_relevance_scale}
  【重要】
  - 标题信息不足以判断时，宁可给低分也不要给高分；但 is_policy 存疑时倾向 true，因为漏掉一份真政策的代价高于多抽一篇。
  - reason 可选，写的话要简短具体，指出标题里哪个词决定了你的判断。
  - 但必须为输入里的**每一个** id 都返回一条结果，id 原样回填，不得改写、不得遗漏、不得新增。

  只输出符合 JSON Schema 的结构化结果。

# _build_prompt 里随数据一起发出的静态指令（数据拼接仍留在 .py）。
user_instructions:
  - 为每一个 id 返回一条结果，id 原样回填。
  - 只依据标题判断，不要推测标题之外的内容。
  - ai_relevance 用 1-5 的整数。

output_schema:
  type: object
  properties:
    results:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: "必须原样回填输入的 id"
          is_policy:
            type: boolean
            description: 是否为真正的政策/法规/规章/标准/规划文件
          ai_relevance:
            type: integer
            minimum: 1
            maximum: 5
            description: 与 AI/智能体的相关度，判定标准见 system prompt
          reason:
            type: string
            description: "≤20 字的判定依据（可选）"
        # reason 故意不列入 required：它是调试用的，一旦要求必填，
        # 模型漏一个就会让整批 schema 校验失败并重试至死，
        # 实测表现为 error_max_structured_output_retries、整批 20 条全丢。
        required: [id, is_policy, ai_relevance]
  required: [results]

# 运行参数真实生效，优先级：.env 环境变量 > 此处 > 代码默认值（param 解析）。
params:
  batch_size: 10          # POLICY_TRIAGE_BATCH_SIZE，实测 20 条偏激进、50 条撞满超时
  max_concurrent: 3       # POLICY_TRIAGE_MAX_CONCURRENT
  max_budget_usd: 2.0     # POLICY_TRIAGE_MAX_BUDGET_USD
  timeout_seconds: 240    # POLICY_TRIAGE_TIMEOUT_SECONDS（minimum=90）
  max_turns: 10

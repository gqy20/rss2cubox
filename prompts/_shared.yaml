# 跨 agent 共享的提示词片段。各 agent yml 的 system_prompt 里用 {shared.片段名} 引用。
#
# 这三个片段原本在各 .py 里各存一份、靠人工同步，实测已发生漂移
# （policy_triage 声称「与深度抽取阶段保持完全一致」，实际措辞已分叉）。
# 统一为单点后，改动只需碰这个文件。

# AI 相关度 1-5 分评分标准 —— policy_triage / policy_enrich 共用。
# 统一自两份漂移文本的语义并集（triage 版的「数据要素」、enrich 版的措辞与示例）。
ai_relevance_scale: |
  5 = 直接规制 AI/算法/大模型/智能体本身（生成式AI服务、算法推荐、深度合成、AI安全标准、大模型备案、人工智能产业条例）
  4 = 虽不点名 AI，但直接约束 AI 系统必然涉及的对象（数据跨境、个人信息处理、自动化决策、训练数据、算力、数据要素）
  3 = 行业性政策，AI 是其中一个受影响的应用方向（金融、医疗、交通、教育领域的数字化/智能化条款）
  2 = 泛数字经济/科技创新政策，与 AI 间接相关
  1 = 与 AI 基本无关（人事任免、行政区划、财政补贴、环保督察等）

# read_webpage 工具的降级说明 —— enrich / global 共用。
read_webpage_note: |-
  （该工具优先走 Jina Reader 返回 Markdown；若目标站点屏蔽了 Jina（如掘金返回 451），会自动降级到 Playwright 真实浏览器渲染并提取正文。）

# 「AI 与智能体领域」的关注方向定义 —— enrich / global / prediction 共用。
# 这是整个系统的领域边界定义，必须单点维护。
focus_areas: |
  - AI 模型能力突破（新架构、新基准、Scaling Law 变化）
  - AI Agent / 智能体框架、工具链、多智能体协作、Agent 运行时
  - LLM 应用层创新（RAG、推理优化、长上下文、多模态）
  - 开源模型与生态动态（权重开源、微调方案、社区趋势）
  - AI 基础设施（算力、芯片、推理优化、训练框架）

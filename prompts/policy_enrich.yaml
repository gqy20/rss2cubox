# 政策文件结构化抽取 Agent（deep enrich）——政策本体：管辖权、法规位阶、立法阶段、
# 生效日期、适用主体、义务强度。防幻觉是首要目标：source_quote 必须是原文逐字引句。
# 迁移自 src/rss2cubox/policy/enrich_agent.py。

version: 1
description: 政策文件逐篇深度结构化抽取，供 AI/智能体方向合规与趋势研判

system_prompt: |-
  你是中国政策与监管分析专家，任务是把政策文件抽取成结构化字段，供 AI/智能体方向的合规与趋势研判使用。

  【铁律】
  1. 只能依据输入提供的标题和正文作答。禁止用你的常识补充文件里没有的信息。
  2. 任何字段无法从材料确定时，字符串填 null、数组填空数组，绝不允许编造或猜测。
  3. source_quote 必须是从材料里逐字复制的原文片段（≤120 字），不能改写、不能拼接、不能翻译。这是人工核查你是否在编造的唯一依据。若只有标题没有正文，就引标题原文。
  4. summary 要回答「这份文件要求谁、做什么、什么时候」，不要复述标题，不要写「本文强调了…的重要性」这类空话。

  【instrument_type 判定】按中国法律位阶：法律(全国人大及其常委会) > 行政法规(国务院) > 部门规章(部委令) / 地方性法规(地方人大) > 地方政府规章(地方政府令) > 规范性文件 > 指导意见。标题含「征求意见稿」一律判为「征求意见稿」，即使它同时是部门规章草案。TC260/信安标委发布的「实践指南」「基本要求」判为「技术标准」。「十五五规划」这类判为「规划」。「关于…的通知」若不含实体规则判为「通知公告」。

  【stage 判定】标题或正文明确「征求…意见」且有截止日期 → 征求意见；已公布但未到施行日期 → 已发布；施行日期已过 → 已生效；被新文件替代 → 已修订；无法判断 → 不明。

  【obligation_level】出现「应当」「必须」「不得」「禁止」等强制性表述 → 强制；「鼓励」「支持」「可以」「建议」→ 推荐；行业标准中自愿采用的 → 自愿；纯人事任免/会议消息等无规制内容 → 不适用。

  【ai_relevance 评分标准】
  {shared.ai_relevance_scale}
  ai_relevance_reason 必须指向材料里的具体内容来支撑这个分数，不能只写「与AI相关」。

  【confidence】材料完整（有正文且条款清晰）可给 4-5；只有标题没有正文时最高只能给 2；标题含糊、正文与标题不匹配时给 1-2。

  【policy_lineage 判定】判断这份文件挂在哪条**政策主线**上——主线是跨层级、跨地区的叙事线（中央规划 → 部委分解 → 地方落地），不是文件主题词。只归入最贴切的一条；确实不属于任何主线时填 null，不要勉强归类：
  - 「十五五规划体系」：各级"十五五"规划纲要、专项规划及其分解落地方案
  - 「人工智能+行动」：AI 赋能产业、应用场景开放、大模型/智能体产业培育
  - 「AI安全与监管」：生成式AI、算法备案、深度合成、安全标准与治理框架
  - 「数据要素与流通」：数据产权、交易流通、公共数据授权运营、数据出境
  - 「算力与数字基础设施」：算力布局、数据中心、网络与算力调度

  只输出符合 JSON Schema 的结构化结果。

# _build_prompt 里随数据一起发出的静态指令（正文截断等数据逻辑留在 .py）。
user_instructions:
  - 严格依据上面的 title 和 full_text 抽取，不得凭常识补充。
  - has_full_text=false 时 key_provisions 给空数组、confidence 不高于 2。
  - source_quote 必须是材料里的逐字原文。
  - 无法确定的字段填 null 或空数组。

# enum 值与 .py 里的 INSTRUMENT_TYPES / STAGES / OBLIGATION_LEVELS 常量保持一致
#（_coerce_enriched 仍用常量做越界降级），tests/test_prompts.py 校验两处同步。
output_schema:
  type: object
  properties:
    issuing_authority:
      type: string
      description: "发布机构全称，如「国务院办公厅」「北京市人民政府」「全国网络安全标准化技术委员会」"
    document_number:
      type: [string, "null"]
      description: "文号，如「国办发〔2026〕12号」。没有则 null"
    jurisdiction:
      type: string
      description: "管辖范围，如「全国」「北京市」「广东省深圳市」"
    instrument_type:
      type: string
      enum: [法律, 行政法规, 部门规章, 地方性法规, 地方政府规章, 规范性文件, 指导意见, 征求意见稿, 技术标准, 规划, 通知公告, 司法解释, 其他]
    stage:
      type: string
      enum: [征求意见, 已发布, 已生效, 已修订, 已废止, 不明]
    effective_date:
      type: [string, "null"]
      description: "生效日期 YYYY-MM-DD。未生效或未提及则 null"
    comment_deadline:
      type: [string, "null"]
      description: "征求意见截止日期 YYYY-MM-DD。非征求意见稿则 null"
    affected_parties:
      type: array
      items: {type: string}
      description: "适用/影响的主体，如「生成式AI服务提供者」「算法推荐服务提供者」「数据处理者」"
    obligation_level:
      type: string
      enum: [强制, 推荐, 自愿, 不适用]
    ai_relevance:
      type: integer
      minimum: 1
      maximum: 5
      description: 与 AI/智能体的相关度，判定标准见 system prompt
    ai_relevance_reason:
      type: string
      description: 给出该相关度评分的具体依据，必须指向原文内容
    summary:
      type: string
      description: 150 字以内的实质内容摘要，说清楚「要求谁做什么」，不要复述标题
    key_provisions:
      type: array
      items: {type: string}
      description: 关键条款要点，每条一句话，最多 6 条。只有标题没有正文时给空数组
    source_quote:
      type: string
      minLength: 4
      description: "支撑上述判断的原文逐字引句，≤120 字。没有正文时引标题"
    confidence:
      type: integer
      minimum: 1
      maximum: 5
      description: 对本次抽取结果的置信度。只有标题没有正文时不应高于 2
    policy_lineage:
      # enum 与 enrich_agent.POLICY_LINEAGES 同步（tests/test_prompts.py 校验），
      # null 表示不属于任何活跃主线。
      type: [string, "null"]
      enum: [十五五规划体系, 人工智能+行动, AI安全与监管, 数据要素与流通, 算力与数字基础设施, null]
      description: 所属政策主线，判定标准见 system prompt；不属于任何主线时填 null
  required:
    - issuing_authority
    - jurisdiction
    - instrument_type
    - stage
    - obligation_level
    - ai_relevance
    - ai_relevance_reason
    - summary
    - key_provisions
    - source_quote
    - confidence

# 运行参数真实生效，优先级：.env 环境变量 > 此处 > 代码默认值（param 解析）。
params:
  max_workers: 4             # POLICY_ENRICH_MAX_WORKERS
  fulltext_workers: 6        # POLICY_FULLTEXT_MAX_WORKERS
  max_text_chars: 12000      # POLICY_ENRICH_MAX_TEXT_CHARS
  min_relevance: 2           # POLICY_ENRICH_MIN_RELEVANCE，triage 后进入 deep enrich 的门槛。
                             # 2026-09-19 由 3 降到 2：实测浅判 2 分的 86 篇里 63% 深度复评 rel≥3、31% 达 4+，
                             # 标题浅判对"正文才有 AI 内容"的文件偏保守。
  max_budget_usd: 1.0        # POLICY_ENRICH_MAX_BUDGET_USD
  timeout_seconds: 180       # POLICY_ENRICH_TIMEOUT_SECONDS（minimum=60）
  max_turns: 6

# AI 趋势预测 Agent —— 基于 signal_clusters 生成未来可验证、可证伪的趋势预测。
# 时间字段（created_at / target_* / horizon_days）由 Python 侧确定：模型生成的时间不可信。
# 迁移自 src/rss2cubox/prediction_agent.py。

version: 1
description: 基于 signal_clusters + historical_reviews 生成可证伪的 trend predictions

system_prompt: |-
  你是 AI 趋势预测 Agent，尤其深耕 AI 与智能体（AI Agent）领域，负责基于 signal_clusters 生成未来可验证的趋势预测。预测必须绑定输入中的 signal_cluster_key，必须可证伪，不能输出泛泛趋势。expected_evidence 必须包含 minimum_support_count、required_source_count、required_evidence_types。必须参考 historical_reviews，避免重复低质量预测，并吸收 improvement_advice 调整证据门槛。prediction_type: 1=延续预测，2=转阶段预测，3=扩散预测，4=反转预测，5=迟到验证。
  【关注重点】在挑选预测目标时，优先考虑以下方向的 cluster：
  {shared.focus_areas}
  以上方向在其他条件相同时应优先被选为预测目标，但不要为了凑数而强行选择弱信号。
  【评分利用】每个 cluster 都带有聚合评分字段，请据此筛选：
  - 优先选择 avg_importance 高（≥3.5）的 cluster，这类信号重要性高
  - avg_confidence 低的 cluster（<3）即使 importance 高也应降低优先级或提高证据门槛
  - 避免对同一 normalized_label 或相似 entities 的 cluster 反复预测，除非有明确的新进展信号
  只输出符合 JSON Schema 的结构化结果。

# run_trend_prediction_agent 里随 clusters 数据一起发出的静态指令。
user_instructions:
  - 只从输入 clusters 中选择值得预测的信号，优先选择 AI/智能体方向且评分高的 cluster。
  - 每条预测必须绑定 signal_cluster_key。
  - 利用 cluster 的 avg_importance、avg_confidence 做筛选排序，不要忽略这些字段。
  - 参考 historical_reviews 中的 score、why_score、improvement_advice，避免重复已失败模式。
  - 不要输出超过 max_predictions 条。

output_schema:
  type: object
  properties:
    predictions:
      type: array
      items:
        type: object
        properties:
          signal_cluster_key: {type: string}
          prediction_type: {type: integer, minimum: 1, maximum: 5}
          # created_at / target_start_at / target_end_at 由 Python 侧确定：
          # 模型生成的时间字符串不可信（实测生成过 2026-09-077 这种非法日期，
          # 导致整批预测保存失败）
          horizon_days: {type: integer, minimum: 1}
          prediction_title: {type: string}
          prediction_body: {type: string}
          watch_keywords: {type: array, items: {type: string}}
          expected_evidence: {type: object}
          disconfirming_evidence: {type: string}
          baseline_metrics: {type: object}
          confidence: {type: integer, minimum: 1, maximum: 5}
          status: {type: string, enum: [pending]}
        required:
          - signal_cluster_key
          - prediction_type
          - prediction_title
          - prediction_body
          - watch_keywords
          - expected_evidence
          - disconfirming_evidence
          - baseline_metrics
          - confidence
          - status
  required: [predictions]

# 运行参数真实生效，优先级：.env 环境变量 > 此处 > 代码默认值（param 解析）。
# created_at / target_start_at / target_end_at / horizon_days 由 Python 侧
# 强制覆写（模型生成的时间与数值均不可信），不进 schema。
params:
  max_budget_usd: 10.0     # TREND_PREDICTION_AGENT_MAX_BUDGET_USD
  timeout_seconds: 900     # TREND_PREDICTION_AGENT_TIMEOUT_SECONDS（minimum=120）
  max_turns: 20

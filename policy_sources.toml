# 政策信源配置
#
# 加站点只改这个文件，不用改代码。每个 [[sites]] 是一个适配器。
# 所有选择器都在 2026-09-15 对真实页面验证过，字段含义见 policy/config.py。
#
# tier = "requests"    服务端渲染，requests + CSS 即可（便宜、快、稳）
# tier = "playwright"  JS 空壳站，必须无头浏览器渲染后再解析
#
# ⚠️ 政府网站改版会让选择器静默失效（返回 0 条但不报错）。
#    policy_source_state.consecutive_empty_runs 会记录连续空跑次数，
#    `make policy-doctor` 可查出疑似失效的站点。

# ── 国家级 ────────────────────────────────────────────────

[[sites]]
key        = "govcn_zhengce"
name       = "中国政府网-国务院信息"
level      = "national"
region     = "全国"
list_url   = "https://www.gov.cn/pushinfo/v150203/rss.xml"
tier       = "rss"
max_items  = 120
note       = "实测 18 个候选源里唯一的原生 RSS，60 条、每日更新。中央/国务院层面的一手源。注意它是「原创推荐」编辑精选，不等于完整的政策文件库（后者只有 HTML，且返回 403）。"

[[sites]]
key           = "tc260_zqyj"
name          = "全国网安标委(TC260)-征求意见与通知"
level         = "national"
region        = "全国"
list_url      = "https://www.tc260.org.cn/front/bzzqyjList.html"
item_selector = "ul.inList > li"
title_attr    = "title"
date_selector = "span.date"
note          = "AI 安全国标的一手源；备案实际审查依据。征求意见稿的预测价值高于正式稿。"

# ── 中科院（机构信源，非行政区划；level 记 national 便于 UI 分组）─────

[[sites]]
key           = "cas_bic"
name          = "中科院国际合作局-通知公告"
level         = "national"
region        = "中科院"
list_url      = "https://bic.cas.cn/tzgg/"
item_selector = "ul.fontlist > li"
date_selector = "time"
max_items     = 60
note          = "CAS 子站群标准 CMS（li > time + a[title]），服务端渲染。国际科技合作项目征集、外籍人员服务。"

[[sites]]
key           = "cas_sdr"
name          = "中科院科促局-通知公告"
level         = "national"
region        = "中科院"
list_url      = "https://sdr.cas.cn/tzgg/"
item_selector = "ul.text_listtime > li"
date_selector = "span.right"
max_items     = 60
note          = "同 CAS 子站群 CMS。成果转化、科技促进发展、奖项推荐公示。院本部 www.cas.cn/tzgg 为空模板死链（2026-09 验证），勿加。"

# ── 省级 / 直辖市 ─────────────────────────────────────────

[[sites]]
key           = "beijing_zhengce"
name          = "北京市-最新政策"
level         = "province"
region        = "北京"
list_url      = "https://www.beijing.gov.cn/zhengce/zhengcefagui/"
item_selector = "ul.default_news > li"
title_attr    = "title"
date_selector = "span"
max_items     = 300
note          = "单页 999 条，含市级/区级/经开区管委会文件。href 是 ./YYYYMM/ 相对路径。"

[[sites]]
key           = "shanghai_gz"
name          = "上海市-政府规章与部门文件"
level         = "province"
region        = "上海"
list_url      = "https://www.shanghai.gov.cn/nw12344/index.html"
item_selector = "ul.tadaty-list > li"
title_attr    = "title"
note          = "日期在 li 文本里，走正则回退提取。"

[[sites]]
key           = "zhejiang_zcjd"
name          = "浙江省-政策解读"
level         = "province"
region        = "浙江"
list_url      = "https://www.zj.gov.cn/col/col1229667607/index.html"
item_selector = "div.Second_box_item > li"
title_attr    = "title"
note          = "用友政务 CMS（/col/colXXX/ 模式），同构站点可复用此选择器。"

[[sites]]
key           = "gd_qbwj"
name          = "广东省-全部文件"
level         = "province"
region        = "广东"
list_url      = "https://www.gd.gov.cn/zwgk/wjk/qbwj/"
item_selector = "div.viewList > ul > li"
title_selector = "span.name > a"
url_selector   = "span.name > a"
note          = "标题在 span.name > a 里，不是 li 直接子元素。"

# ── 市级 ──────────────────────────────────────────────────

[[sites]]
key           = "suzhou_zcfg"
name          = "苏州市-政策文件"
level         = "city"
region        = "苏州"
# 2026-09-19 禁用：triage 实测 42 条里 0 条 AI 相关度 ≥3，30 条非政策（停水/月票类），
# 信噪比过低。若后续要恢复，先跑 policy-triage 复核。
enabled       = false
list_url      = "https://www.suzhou.gov.cn/szsrmzf/zfwj/zcfg.shtml"
# 页面上并列多个列表：ul.infolist 是时政要闻（实测仅 13/50 是政策），
# 真正的政策列表是下面两个：jgfk=征求意见反馈（7/9）、tzgg=通知公告（10/16）。
# cssselect 支持逗号组合选择器，所以一个站点可以取多个容器。
item_selector = "ul.index-jgfk-list > li, ul.index-tzgg-list > li"
title_attr    = "title"
max_items     = 120
title_exclude = ["查看更多", "年度报告", "年度报表"]
note          = "征求意见反馈栏目价值最高：能看到法规从征求意见到废止的完整生命周期。"

